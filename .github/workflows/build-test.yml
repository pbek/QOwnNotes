name: Build QOwnNotes

on:
  push:
    branches-ignore:
      - release
    tags-ignore:
      - "*"
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-including-paths
    # if [[ ${changed_file} = src* ]] || [[ ${changed_file} = tests* ]] || [[ ${changed_file} = build-systems/github/* ]] || [[ ${changed_file} = ".github/workflows/build-test.yml" ]] ;
    paths:
      - "src/**"
      - "snap/**"
      - "tests/**"
      - "build-systems/github/**"
      - ".github/actions/build-snap/**"
      - ".github/workflows/build-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "snap/**"
      - "tests/**"
      - "build-systems/github/**"
      - ".github/actions/build-snap/**"
      - ".github/workflows/build-test.yml"
  workflow_dispatch:
#  schedule:
#    - cron: "0 0 */3 * *"

defaults:
  run:
    working-directory: src

env:
  QT_MODULES: "qtwebsockets"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
        # Linux:   https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/
        # macOS:   https://download.qt.io/online/qtsdkrepository/mac_x64/desktop/
        # Windows: https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/
        # aqt Qt versions: https://ddalcino.github.io/aqt-list-server/
        qt-version:
          [
            "5.9.9",
            "5.13.2",
            "5.14.2",
            "5.15.2",
            "6.2.4",
            "6.4.3",
            "6.5.3",
            "6.6.3",
            "6.7.3",
            "6.8.3",
            "6.9.1",
            "6.10.0",
          ]
        experimental: [false]
        exclude:
          # Failing SSL Tests
          - os: ubuntu-latest
            qt-version: "5.9.9"
          # Build tools not found
          - os: windows-2025
            qt-version: "5.9.9"
          # Build tools not found
          - os: windows-2025
            qt-version: "5.13.2"
          # Build tools not found
          - os: windows-2025
            qt-version: "5.14.2"
          # Build tools not found
          - os: windows-2025
            qt-version: "5.15.2"
          # We only want 6.9.1+ for Windows
          - os: windows-2025
            qt-version: "6.2.4"
          # We only want 6.9.1+ for Windows
          - os: windows-2025
            qt-version: "6.4.3"
          # We only want 6.9.1+ for Windows
          - os: windows-2025
            qt-version: "6.5.3"
          # We only want 6.9.1+ for Windows
          - os: windows-2025
            qt-version: "6.6.3"
          # We only want 6.9.1+ for Windows
          - os: windows-2025
            qt-version: "6.7.3"
          # We only want 6.9.1+ for Windows
          - os: windows-2025
            qt-version: "6.8.3"
        #        include:
        #          - os: ubuntu-latest
        #            qt-version: '6.3.0'
        #            experimental: true
        #          - os: macos-15
        #            qt-version: '6.3.0'
        #            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

        #
        # Install Qt
        #

      # https://github.com/jurplel/install-qt-action
      - if: contains( matrix.os, 'windows') && ( matrix.qt-version == '5.9.9' )
        name: Install Qt 5.9 on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: win32_mingw53
          cache: true
          aqtversion: "==0.9.4"
      - if: contains( matrix.os, 'windows') && ( ( matrix.qt-version == '5.13.2' ) || ( matrix.qt-version == '5.14.2' ) )
        name: Install Qt on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: win64_mingw73
          cache: true
      - if: contains( matrix.os, 'windows') && matrix.qt-version == '5.15.2'
        name: Install Qt 5.15.2 on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: win64_mingw81
          cache: true
      - if: contains( matrix.os, 'windows') && startsWith( matrix.qt-version, '6.' )
        name: Install Qt 6 on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          modules: ${{env.QT_MODULES}}
          cache: true
      - if: false == contains( matrix.os, 'windows') && false == startsWith( matrix.qt-version, '6.' )
        name: Install Qt < 6 on Linux/macOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          cache: true
      - if: false == contains( matrix.os, 'windows') && startsWith( matrix.qt-version, '6.' )
        name: Install Qt 6 on Linux/macOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          modules: ${{env.QT_MODULES}}
          cache: true
      - if: contains( matrix.os, 'windows') && startsWith( matrix.qt-version, '6.' )
        name: Make sure MSVC is found on Windows for Qt 6
        uses: ilammy/msvc-dev-cmd@v1

        #
        # Do tests
        #

      # Qt's CMake packages need the OpenGL and xkbcommon development headers,
      # and Qt6PrintSupport needs the CUPS development headers in some Qt versions (e.g. 6.7)
      - if: contains( matrix.os, 'ubuntu-latest') && startsWith( matrix.qt-version, '6.' )
        name: Install CMake test dependencies on Linux
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libxkbcommon-dev libcups2-dev
      # The unit tests are only built with Qt 6
      - if: contains( matrix.os, 'ubuntu-latest') && startsWith( matrix.qt-version, '6.' )
        name: Do Linux tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" &&
            cmake --build build-tests --parallel 8 &&
            build-tests/bin/tests -platform minimal -txt
      - if: contains( matrix.os, 'macos') && startsWith( matrix.qt-version, '6.' )
        name: Do macOS tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" &&
            cmake --build build-tests --parallel 8 &&
            build-tests/bin/tests -platform minimal -txt
      # Disable Qt5 Windows tests, because build tools are missing and we build Qt6 only now
      #      - if: contains( matrix.os, 'windows') && startsWith( matrix.qt-version, '5.' )
      #        name: Do Qt5 Windows tests
      #        run: |
      #          $ErrorActionPreference = 'Stop'
      #          cd ..\tests
      #          qmake DEFINES+=INTEGRATION_TESTS
      #          make
      #          copy ..\build-systems\github\windows\libcrypto-1_1-x64.dll .
      #          copy ..\build-systems\github\windows\libssl-1_1-x64.dll .
      #          Get-ChildItem -Recurse -Force ..
      #          copy ..\bin\tests\tests.exe .
      #          # echo set
      #          # gci env:* | sort-object name
      #          # echo path
      #          # echo echo $env:PATH
      #          # cd ..\bin\tests
      #          # echo test1
      #          # .\tests.exe -txt
      #          # echo windeployqt
      #          windeployqt --debug tests.exe
      #          # echo test2
      #          .\tests.exe -txt
      #      - if: contains( matrix.os, 'windows') && startsWith( matrix.qt-version, '6.' )
      #        name: Do Qt 6.3+ Windows tests
      #        uses: nick-fields/retry@v4
      #        with:
      #          timeout_minutes: 10
      #          max_attempts: 3
      #          retry_on: error
      #          shell: pwsh
      #          command: |
      #            $ErrorActionPreference = 'Stop'
      #            cd src\..\tests
      #            qmake6 DEFINES+=INTEGRATION_TESTS
      #            nmake
      #            copy ..\build-systems\github\windows\libcrypto-1_1-x64.dll .
      #            copy ..\build-systems\github\windows\libssl-1_1-x64.dll .
      #            copy ..\bin\tests\tests.exe .
      #            windeployqt --debug tests.exe
      #            .\tests.exe -txt

      #
      # Build QOwnNotes
      #

      - if: true && !(contains( matrix.os, 'windows') && (matrix.qt-version == '5.15.2' || startsWith( matrix.qt-version, '6.' ))) && !contains( matrix.os, 'macos')
        name: Build QOwnNotes
        run: |
          lrelease QOwnNotes.pro && qmake CONFIG+=debug CONFIG+=DEV_MODE && make -j 8
      # qmake workaround: https://bugreports.qt.io/browse/QTBUG-117225?focusedId=754625&page=com.atlassian.jira.plugin.system.issuetabpanels%3Acomment-tabpanel#comment-754625
      # See https://github.com/pbek/QOwnNotes/issues/3018
      - if: contains( matrix.os, 'macos')
        name: Build QOwnNotes for macOS with qmake fix
        run: |
          lrelease QOwnNotes.pro && qmake CONFIG+=debug CONFIG+=DEV_MODE -early QMAKE_DEFAULT_LIBDIRS=$(xcrun -show-sdk-path)/usr/lib && make -j 8
          ../build-systems/github/macos/create-dmg.sh
      - if: contains( matrix.os, 'windows') && startsWith( matrix.qt-version, '6.' )
        name: Build QOwnNotes for Windows with Qt 6
        run: |
          qmake6 CONFIG+=debug QOwnNotes.pro CONFIG+=DEV_MODE
          nmake

  # Build runnable packages independently of the compatibility-test matrix.
  build-appimage:
    name: "🐧 AppImage Qt6"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      QT_VERSION: 6.10.2
      QT_MODULES: "qtwebsockets qtwaylandcompositor"
      BUILD_DIR: build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-composite0 libxcb-cursor0 libxcb-damage0 libxcb-dpms0 libxcb-dri2-0 libxcb-dri3-0 libxcb-ewmh2 libxcb-glx0 libxcb-present0 libxcb-randr0 libxcb-record0 libxcb-render0 libxcb-res0 libxcb-screensaver0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxkbcommon-x11-0

      - name: Compile application
        run: |
          echo '#define RELEASE "AppImage"' > release.h
          qmake QOwnNotes.pro CONFIG+=release PREFIX=/usr
          lrelease QOwnNotes.pro
          make -j8

      - name: Install linuxdeploy
        run: |
          LINUXDEPLOY_VERSION=1-alpha-20240109-1
          APPIMAGE_RUNTIME_SHA256=156f4bdbde9c52d01814600013e0a273f0118dc2de98975f3c8c63427ec79074
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-plugin-qt-x86_64.AppImage
          wget https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "${APPIMAGE_RUNTIME_SHA256}  runtime-x86_64" | sha256sum --check --strict
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Create AppImage
        run: |
          QT_DIR="${QT_ROOT_DIR}"
          export QMAKE="${QT_DIR}/bin/qmake"
          export PATH="${QT_DIR}/libexec:$PATH"
          export EXTRA_PLATFORM_PLUGINS="libqwayland.so"
          export EXTRA_QT_MODULES="Qml;QmlWorkerScript;QmlModels;Quick"
          export QML_SOURCES_PATHS="../docs/scripting/examples"
          export QML_MODULES_PATHS="${QT_DIR}/qml"

          copy_qt_plugin_dir() {
            local plugin_dir="$1"
            if [ -d "${QT_DIR}/plugins/${plugin_dir}" ]; then
              mkdir -p "${BUILD_DIR}/usr/plugins/${plugin_dir}"
              cp -a "${QT_DIR}/plugins/${plugin_dir}/." "${BUILD_DIR}/usr/plugins/${plugin_dir}/"
            fi
          }

          cp ../icons/icon.png QOwnNotes.png
          # Only SQLite is needed; other SQL drivers require external client libraries.
          find "${QT_DIR}/plugins/sqldrivers" -name '*.so' ! -name '*sqlite*' -delete
          mkdir -p "${BUILD_DIR}/usr/plugins/iconengines" "${BUILD_DIR}/usr/languages"
          cp "${QT_DIR}/plugins/iconengines/libqsvgicon.so" "${BUILD_DIR}/usr/plugins/iconengines/"
          cp languages/*.qm "${BUILD_DIR}/usr/languages/"

          ./linuxdeploy-x86_64.AppImage \
            --appdir "${BUILD_DIR}" \
            -e QOwnNotes -i QOwnNotes.png -d PBE.QOwnNotes.desktop --plugin qt

          # Deploy Wayland support in addition to linuxdeploy's default xcb platform.
          copy_qt_plugin_dir platforms
          copy_qt_plugin_dir wayland-decoration-client
          copy_qt_plugin_dir wayland-graphics-integration-client
          copy_qt_plugin_dir wayland-shell-integration
          test -f "${BUILD_DIR}/usr/plugins/platforms/libqwayland.so"

          # Ensure script-engine QML imports resolve from the bundle.
          QML_DEST="${BUILD_DIR}/usr/qml"
          for mod in QtQml QtQuick QtQml/WorkerScript; do
            if [ -d "${QT_DIR}/qml/${mod}" ] && [ ! -d "${QML_DEST}/${mod}" ]; then
              mkdir -p "${QML_DEST}/${mod}"
              cp -a "${QT_DIR}/qml/${mod}/." "${QML_DEST}/${mod}/"
            fi
          done

          cat > "${BUILD_DIR}/usr/bin/qt.conf" <<'QTCONF'
          [Paths]
          Prefix = ..
          Plugins = plugins
          Qml2Imports = qml
          QmlImports = qml
          QTCONF

          mkdir -p "${BUILD_DIR}/usr/lib"
          cp -L /usr/lib/x86_64-linux-gnu/libssl.so.3 "${BUILD_DIR}/usr/lib/"
          cp -L /usr/lib/x86_64-linux-gnu/libcrypto.so.3 "${BUILD_DIR}/usr/lib/"
          LDAI_RUNTIME_FILE="$PWD/runtime-x86_64" \
            ./linuxdeploy-x86_64.AppImage --appdir "${BUILD_DIR}" --output appimage

          rm linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage runtime-x86_64
          mv ./*.AppImage QOwnNotes-x86_64.AppImage
          if strings QOwnNotes-x86_64.AppImage | grep -F 'libfuse.so.2' > /dev/null; then
            echo "The AppImage still contains the legacy dynamic FUSE runtime" >&2
            exit 1
          fi
          sha256sum QOwnNotes-x86_64.AppImage > QOwnNotes-x86_64.AppImage.sha256sum

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: QOwnNotes-AppImage-Qt6
          path: |
            src/QOwnNotes-x86_64.AppImage
            src/QOwnNotes-x86_64.AppImage.sha256sum
          if-no-files-found: error

  build-windows:
    name: "🧊 Windows Qt6"
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      QT_VERSION: 6.10.1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Make sure MSVC is found
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows ZIP
        run: '& ..\build-systems\github\windows\build-zip-qt6.ps1'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: QOwnNotes-Windows-Qt6
          path: |
            QOwnNotes.zip
            QOwnNotes.zip.sha256
            QOwnNotes.zip.sha256sum
          if-no-files-found: error

  build-macos:
    name: "🍎 macOS Qt6"
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_VERSION: 6.10.1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Set version
        run: |
          VERSION=$(sed 's/[^0-9,.]//g' version.h)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build universal macOS DMG
        run: |
          echo '#define RELEASE "GitHub Actions"' > release.h
          lrelease QOwnNotes.pro
          qmake QOwnNotes.pro CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS="x86_64 arm64"
          make -j8
          ../build-systems/github/macos/create-dmg-qt6.sh
          shasum -a 256 QOwnNotes.dmg > QOwnNotes.dmg.sha256sum

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: QOwnNotes-macOS-Qt6
          path: |
            src/QOwnNotes.dmg
            src/QOwnNotes.dmg.sha256sum
          if-no-files-found: error

  build-snap:
    name: "🐧 Snap Qt6"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: "📂 Prepare snap source"
        run: ../build-systems/github/snap.qt6/prepare-source.sh

      - name: "🚧 Build snap"
        uses: ./.github/actions/build-snap
        id: snapcraft
        with:
          path: build-systems/github/snap.qt6

      - name: "🔎 Create snap checksum"
        shell: bash
        run: |
          SNAP_PATH="${{ steps.snapcraft.outputs.snap }}"
          sha256sum "${SNAP_PATH}" > "${SNAP_PATH}.sha256sum"
          echo "SNAP_PATH=${SNAP_PATH}" >> "$GITHUB_ENV"
          ls -hal "${SNAP_PATH}" "${SNAP_PATH}.sha256sum"

      - name: "📦 Upload snap artifact"
        uses: actions/upload-artifact@v7
        with:
          name: QOwnNotes-Snap-Qt6
          path: |
            ${{ env.SNAP_PATH }}
            ${{ env.SNAP_PATH }}.sha256sum
          if-no-files-found: error
